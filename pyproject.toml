[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-dbtools"
version = "1.2.0"
description = "MCP server for TDH (Transwarp Data Hub) and GaussDB / openGauss via JDBC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.9.0,<2.0.0",  # 使用成熟的 1.x FastMCP API
    "jaydebeapi>=1.2.3",
    "jpype1>=1.5.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",  # crypto.py 直接使用；不能只靠 mcp -> pyjwt[crypto] 传递依赖
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "tomli>=2.0.1; python_version < '3.11'",  # tomllib 在 3.11 才进标准库，3.10 走 tomli
]

[project.scripts]
mcp-dbtools = "mcp_dbtools.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
